<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="100%" role="img" aria-label="Геометрия измерения метки"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6876"/></marker></defs><rect x="7.5" y="7.5" width="325" height="325" fill="#fbf1e2" stroke="#b36a00" stroke-width="1.2" /><rect x="59.5" y="59.5" width="221" height="221" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="98.5" y="98.5" width="143" height="143" fill="#eef4f8" stroke="#0b7894" stroke-width="1.2" /><rect x="111.5" y="111.5" width="117" height="117" fill="none" stroke="#16202c" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="170" cy="170" r="5" fill="#0b7894"/><text x="345" y="40" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#b36a00">Кольцо фона: r + gap < d ≤ out</text><text x="345" y="58" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#5b6876">фон = медиана, шум = Q84 − медиана</text><text x="345" y="92" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#5b6876">Зазор gap = round(p): ~1 пиксель детектора</text><text x="345" y="126" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#0b7894">Окно поиска пика: ±r, r = max(2, round(2p))</text><text x="345" y="144" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#5b6876">= ±2 пикселя детектора</text><text x="345" y="178" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#16202c">Апертура: 3×3 пикселя детектора</text><text x="345" y="196" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#5b6876">(2·round(1.5p)+1)² отсчётов сетки, сумма / p²</text><text x="345" y="230" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#5b6876">p — отсчётов сетки на пиксель 6,15″</text><text x="345" y="248" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#5b6876">рисунок для p = 2,5 (поле 18′): r=5, gap=3, band=4</text><text x="345" y="282" font-family="Onest, Segoe UI, sans-serif" font-size="14.5" fill="#5b6876">d — расстояние Чебышёва (max |Δi|, |Δj|)</text></svg>