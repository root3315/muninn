<canvas id="vr-canvas" class="vr__canvas" aria-label="The sky in 3D"></canvas>

<header class="vr__head">

  <div class="vr__title">

  </div>

  <span class="vr__sound">
    <button id="vr-sound" class="vr__diag-toggle" type="button" aria-pressed="true" data-vr="vr.soundOn">Sound: on</button>
    <button id="vr-air" class="vr__diag-toggle" type="button" aria-pressed="true" data-vr="vr.airOn">Flight sound: on</button>

  </span>
