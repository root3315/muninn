<!doctype html>
<html lang="en" data-band="D2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muninn — the talk</title>
<meta name="description" content="Muninn in ten slides and an appendix: the problem, the evidence from real SPHEREx frames, what it cannot find, and what is next.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#171721">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171721'/%3E%3Ccircle cx='11' cy='13' r='2.5' fill='%23e6f0f7'/%3E%3Ccircle cx='21' cy='19' r='2.5' fill='%2356c1f5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://nasa-irsa-spherex.s3.us-east-1.amazonaws.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/redesign.css">
<link rel="stylesheet" href="css/talk.css">
</head>
<body>

<header class="bar">
  <a class="bar__brand" href="./">
    <strong>Muninn</strong>
  </a>
  <p class="bar__event" data-t="event"></p>
  <nav class="bar__acts">
    <a class="bar__link" id="pdf" href="talk.pdf" data-t="pdf"></a>
    <a class="bar__link" href="./" data-t="openTool"></a>
    <button type="button" class="bar__lang" id="lang"></button>
  </nav>
</header>

<main class="deck" id="deck">

  <!-- 1 · the problem, and who the tool is for -->
  <section class="slide slide--problem" data-slide>
    <div class="slide__text">
      <h1 class="slide__claim" data-t="p.claim"></h1>
      <p class="slide__say" data-t="p.say"></p>
      <p class="slide__src" data-t="p.src"></p>
    </div>
    <figure class="exhibit">
      <dl class="claims">
        <div class="claims__row"><dt data-t="p.f1"></dt><dd data-t="p.f1v"></dd></div>
        <div class="claims__row"><dt data-t="p.f2"></dt><dd data-t="p.f2v"></dd></div>
        <div class="claims__row"><dt data-t="p.f3"></dt><dd data-t="p.f3v"></dd></div>
      </dl>
      <div class="audience">
        <p class="exhibit__k" data-t="p.for"></p>
        <ul class="audience__list">
          <li data-t="p.for1"></li>
          <li data-t="p.for2"></li>
          <li data-t="p.for3"></li>
        </ul>
      </div>
    </figure>
  </section>

  <!-- 2 · the frames themselves, read live -->
  <section class="slide slide--live" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="s1.claim"></h2>
      <p class="slide__say" data-t="s1.say"></p>
      <p class="slide__src" data-t="s1.src"></p>
    </div>
    <figure class="exhibit exhibit--plate">
      <div class="plate">
        <canvas id="blink" width="264" height="264" role="img" data-t-label="s1.alt"></canvas>
        <!-- The ring the tool itself draws: a catalogued body, at the place and
             the moment SkyBoT gives for this exposure. Shown on that visit only. -->
        <p class="plate__ring num" id="blink-ring" hidden>(152) Atala</p>
        <p class="plate__wait" id="blink-wait" data-t="s1.wait"></p>
      </div>
      <figcaption class="plate__cap">
        <span class="plate__date num" id="blink-date">—</span>
        <span class="plate__band num">D2 · 1.10–1.65 µm · 9′ × 9′</span>
        <ol class="reads num" id="reads"></ol>
        <!-- The blink in the hand: step a visit back or on, hold it, let it run. -->
        <div class="plate__keys">
          <button type="button" class="plate__key" id="blink-prev" data-t-label="s1.prevVisit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
          </button>
          <button type="button" class="plate__key plate__key--play" id="blink-play" aria-pressed="true" data-t-label="s1.play">
            <svg class="plate__pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
            <svg class="plate__go" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          </button>
          <button type="button" class="plate__key" id="blink-next" data-t-label="s1.nextVisit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
          </button>
        </div>
      </figcaption>
    </figure>
  </section>

  <!-- 3 · a mover found, and named -->
  <section class="slide slide--run" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="s3.claim"></h2>
      <p class="slide__say" data-t="s3.say"></p>
      <p class="slide__src" data-t="s3.src"></p>
    </div>
    <figure class="exhibit">
      <p class="exhibit__k" data-t="s3.head"></p>
      <ol class="snr num" id="snr"></ol>
    </figure>
  </section>

  <!-- 4 · a discovery refused -->
  <section class="slide slide--duel" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="s4.claim"></h2>
      <p class="slide__say" data-t="s4.say"></p>
      <p class="slide__src" data-t="s4.src"></p>
    </div>
    <figure class="exhibit">
      <p class="exhibit__k" data-t="s4.head"></p>
      <div class="verdicts">
        <div class="verdicts__one">
          <p class="verdicts__k" data-t="s4.before"></p>
          <p class="verdicts__v verdicts__v--alarm num" data-n="140" data-digits="0"></p>
          <p class="verdicts__say" data-t="s4.beforeSay"></p>
        </div>
        <div class="verdicts__one">
          <p class="verdicts__k" data-t="s4.after"></p>
          <p class="verdicts__v num" data-n="1.2" data-digits="1"></p>
          <p class="verdicts__say" data-t="s4.afterSay"></p>
        </div>
      </div>
      <dl class="flags num">
        <div><dt>FLAGS</dt><dd>0x45</dd></div>
        <div><dt>bit 0</dt><dd>TRANSIENT</dd></div>
        <div><dt>bit 2</dt><dd>SUR_ERROR</dd></div>
        <div><dt>bit 6</dt><dd>NONFUNC</dd></div>
      </dl>
    </figure>
  </section>

  <!-- 5 · AllWISE 2010 beside a SPHEREx visit, the star marked on both -->
  <section class="slide slide--wise" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="wise.claim"></h2>
      <p class="slide__say" data-t="wise.say"></p>
      <p class="slide__src" data-t="wise.src"></p>
    </div>
    <figure class="exhibit exhibit--wise">
      <div class="wipe">
        <img class="wipe__b" src="img/talk/barnard-wise.png" alt="">
        <img class="wipe__a" src="img/talk/barnard-spherex.png" alt="">
        <span class="wipe__divider" aria-hidden="true"></span>
        <!-- Where the star stood for each telescope, measured on these two pictures. -->
        <svg class="wipe__marks" viewBox="0 0 900 676" aria-hidden="true">
          <path class="wipe__path" d="M436.1 507.3 L446.1 372.2" pathLength="1"/>
          <path class="wipe__head" d="M446.1 372.2 L437.1 385.6 L453.1 386.8 Z"/>
          <circle class="wipe__at wipe__at--b" cx="433.6" cy="541.2" r="30"/>
          <circle class="wipe__at wipe__at--a" cx="448.6" cy="338.3" r="30"/>
          <path class="wipe__span" d="M398 541.2 h-14 v-69.8 h14"/>
        </svg>
        <span class="wipe__tag wipe__tag--b" style="--x: 48.18%; --y: 80.06%" data-t="wise.tagB"></span>
        <span class="wipe__tag wipe__tag--a" style="--x: 49.85%; --y: 50.04%" data-t="wise.tagA"></span>
        <span class="wipe__tag wipe__tag--span num" style="--x: 42.6%; --y: 74.9%" data-t="wise.f1v"></span>
      </div>
      <div class="wipe__legend">
        <p><span class="slotchip slotchip--a">A</span><span data-t="wise.a"></span></p>
        <p><span class="slotchip slotchip--b">B</span><span data-t="wise.b"></span></p>
      </div>
      <dl class="wise__facts">
        <div><dt data-t="wise.f1"></dt><dd class="num" data-t="wise.f1v"></dd></div>
        <div><dt data-t="wise.f2"></dt><dd class="num" data-t="wise.f2v"></dd></div>
        <div><dt data-t="wise.f3"></dt><dd class="num" data-t="wise.f3v"></dd></div>
      </dl>
    </figure>
  </section>

  <!-- 6 · the challenge's own targets, each one marked -->
  <section class="slide slide--targets" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="s5.claim"></h2>
      <p class="slide__say" data-t="s5.say"></p>
      <p class="slide__src" data-t="s5.src"></p>
    </div>
    <figure class="exhibit">
      <p class="exhibit__k" data-t="s5.head"></p>
      <ol class="targets" id="targets"></ol>
    </figure>
  </section>

  <!-- 7 · blind within a season; the season link checks the parallax arc -->
  <section class="slide slide--hunt" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="hunt.claim"></h2>
      <p class="slide__say" data-t="hunt.say"></p>
      <p class="slide__src" data-t="hunt.src"></p>
    </div>
    <figure class="exhibit exhibit--hunt">
      <div class="rate">
        <p class="exhibit__k" data-t="hunt.head"></p>
        <svg class="rate__chart" id="rate" role="img" data-t-label="hunt.alt"></svg>
      </div>
      <div class="season">
        <p class="exhibit__k" data-t="link.head"></p>
        <ol class="link__steps">
          <li data-t="link.s1"></li>
          <li data-t="link.s2"></li>
          <li data-t="link.s3"></li>
        </ol>
        <p class="link__test" data-t="link.test"></p>
      </div>
    </figure>
  </section>

  <!-- 8 · how far SPHEREx is from Planet X -->
  <section class="slide slide--reach" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="s6.claim"></h2>
      <p class="slide__say" data-t="s6.say"></p>
      <p class="slide__src" data-t="s6.src"></p>
    </div>
    <figure class="exhibit">
      <p class="exhibit__k" data-t="s6.head"></p>
      <svg class="reach" id="reach" role="img" data-t-label="s6.alt"></svg>
      <dl class="reach__rows num" id="reach-rows"></dl>
      <p class="reach__assume" data-t="s6.assume"></p>
    </figure>
  </section>

  <!-- 9 · every resource, credited by name -->
  <section class="slide slide--sources" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="src.claim"></h2>
      <p class="slide__src" data-t="src.src"></p>
    </div>
    <figure class="exhibit">
      <div class="sources">
        <div>
          <p class="exhibit__k" data-t="src.nasa"></p>
          <dl class="sources__list" id="sources-nasa"></dl>
        </div>
        <div>
          <p class="exhibit__k" data-t="src.csa"></p>
          <dl class="sources__list" id="sources-csa"></dl>
        </div>
        <div>
          <p class="exhibit__k" data-t="src.also"></p>
          <dl class="sources__list" id="sources-also"></dl>
        </div>
      </div>
    </figure>
  </section>

  <!-- 10 · what it does, what it does not, where to find it -->
  <section class="slide slide--close" data-slide>
    <div class="slide__text">
      <h2 class="slide__claim" data-t="end.claim"></h2>
      <ul class="ends">
        <li><span data-t="end.live"></span><a class="num" href="https://muninn.mydevbox.xyz">muninn.mydevbox.xyz</a></li>
        <li><span data-t="end.repo"></span><a class="num" href="https://github.com/root3315/muninn">github.com/root3315/muninn</a></li>
      </ul>
      <div class="team">
        <p class="exhibit__k" data-t="end.team"></p>
        <ul class="team__who">
          <li>Khurshiddinov Timur Khurshiddinovich <span data-t="end.owner"></span></li>
          <li>Stepan Ionichev</li>
          <li>Muhammadyusuf Bahtiyarov</li>
          <li>Edem</li>
          <li>Temur Kholjigitov</li>
          <li>Khamidkhodjayeva Fayziya</li>
        </ul>
      </div>
    </div>
    <figure class="exhibit">
      <div class="ledger">
        <div>
          <p class="exhibit__k" data-t="s7.does"></p>
          <ul>
            <li data-t="s7.does1"></li>
            <li data-t="s7.does2"></li>
            <li data-t="s7.does3"></li>
            <li data-t="s7.does4"></li>
          </ul>
        </div>
        <div>
          <p class="exhibit__k" data-t="s7.not"></p>
          <ul>
            <li data-t="s7.not1"></li>
            <li data-t="s7.not2"></li>
            <li data-t="s7.not3"></li>
          </ul>
        </div>
      </div>
      <p class="next"><strong data-t="end.nextK"></strong> <span data-t="end.next"></span></p>
    </figure>
  </section>

  <!-- 11 · the appendix -->
  <section class="slide slide--divider" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="app.claim"></h2>
      <p class="slide__say" data-t="app.say"></p>
    </div>
    <figure class="exhibit">
      <ol class="contents" id="contents"></ol>
    </figure>
  </section>

  <!-- 12 · the way in: the real sky -->
  <section class="slide slide--sky" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="sky.claim"></h2>
      <p class="slide__say" data-t="sky.say"></p>
      <ol class="beats" id="sky-beats">
        <li data-t="sky.beat1"></li>
        <li data-t="sky.beat2"></li>
        <li data-t="sky.beat3"></li>
        <li data-t="sky.beat4"></li>
      </ol>
      <p class="slide__src" data-t="sky.src"></p>
    </div>
    <figure class="exhibit exhibit--sky">
      <div class="dome">
        <!-- The tool's own sky: gate.js, the same catalogue, the same reticle. -->
        <canvas class="dome__sky" id="dome" aria-hidden="true"></canvas>
        <img class="dome__field" id="dome-field" alt="">
        <p class="dome__at num" id="dome-at"></p>
        <article class="card" id="card">
          <figure class="card__frame">
            <img id="card-img" alt="" width="280" height="280">
            <figcaption class="card__tag num" id="card-tag"></figcaption>
          </figure>
          <div class="card__body">
            <h3 class="card__name" id="card-name"></h3>
            <p class="card__kind" id="card-kind"></p>
            <dl class="card__facts" id="card-facts"></dl>
            <p class="card__go"><span data-t="sky.open"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></p>
          </div>
        </article>
      </div>
    </figure>
  </section>

  <!-- 13 · five ways to compare one grid -->
  <section class="slide slide--modes" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="modes.claim"></h2>
      <p class="slide__say" data-t="modes.say"></p>
      <p class="slide__src" data-t="modes.src"></p>
    </div>
    <figure class="exhibit exhibit--modes">
      <div class="modes" role="group" id="modes"></div>
      <div class="view" id="view" data-mode="blink">
        <img class="view__a" src="img/talk/atala-a.png" alt="">
        <img class="view__b" src="img/talk/atala-b.png" alt="">
        <img class="view__diff" src="img/talk/atala-diff.png" alt="">
        <img class="view__stack" src="img/talk/atala-stack.png" alt="">
        <span class="view__divider" aria-hidden="true"></span>
        <p class="view__date num" id="view-date"></p>
      </div>
      <p class="view__what" id="view-what"></p>
    </figure>
  </section>

  <!-- 14 · six bands, a width, the address -->
  <section class="slide slide--bands" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="bands.claim"></h2>
      <p class="slide__say" data-t="bands.say"></p>
      <p class="slide__src" data-t="bands.src"></p>
    </div>
    <figure class="exhibit">
      <p class="exhibit__k" data-t="bands.head"></p>
      <ol class="lambdas" id="bands"></ol>
      <div class="widths">
        <p class="exhibit__k" data-t="bands.width"></p>
        <ol class="widths__row num" id="widths"></ol>
      </div>
      <div class="permalink">
        <p class="exhibit__k" data-t="bands.link"></p>
        <p class="address num" id="address"></p>
      </div>
    </figure>
  </section>

  <!-- 15 · how little of the archive that took -->
  <section class="slide slide--bytes" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="s2.claim"></h2>
      <p class="slide__say" data-t="s2.say"></p>
      <p class="slide__src" data-t="s2.src"></p>
    </div>
    <figure class="exhibit">
      <!-- The whole file, edge to edge, and the part of it that was read. -->
      <p class="share"><span class="share__n num" id="bytes-pct">—</span><span class="share__unit">%</span>
        <span class="share__what" data-t="s2.share"></span></p>
      <div class="filebar" aria-hidden="true"><span id="filebar-read"></span></div>
      <p class="exhibit__k" data-t="s2.head"></p>
      <ol class="bytes" id="bytes"></ol>
      <p class="exhibit__sum" id="bytes-sum"></p>
      <ol class="steps">
        <li><span class="num" data-t="s2.size1"></span><span data-t="s2.step1"></span></li>
        <li><span class="num" data-t="s2.size2"></span><span data-t="s2.step2"></span></li>
        <li><span class="num" data-t="s2.size2"></span><span data-t="s2.step3"></span></li>
      </ol>
    </figure>
  </section>

  <!-- 16 · a mark, measured in every visit, and its spectrum -->
  <section class="slide slide--mark" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="mark.claim"></h2>
      <p class="slide__say" data-t="mark.say"></p>
      <p class="slide__src" data-t="mark.src"></p>
    </div>
    <figure class="exhibit exhibit--mark">
      <div class="shot shot--plate"><img src="img/talk/mark-plate.png" alt=""></div>
      <div class="shot shot--card"><img data-src-lang="img/talk/mark-card.{lang}.png" alt=""></div>
      <div class="shot shot--spectrum"><img data-src-lang="img/talk/mark-spectrum.{lang}.png" alt=""></div>
      <p class="csv num" id="csv"></p>
    </figure>
  </section>

  <!-- 17 · other missions' catalogues, over the frame -->
  <section class="slide slide--overlay" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="ov.claim"></h2>
      <p class="slide__say" data-t="ov.say"></p>
      <p class="slide__src" data-t="ov.src"></p>
    </div>
    <figure class="exhibit exhibit--overlay">
      <div class="shot shot--layers">
        <img src="img/talk/barnard-spherex.png" alt="">
        <img class="shot__over" src="img/talk/barnard-overlay.png" alt="">
      </div>
      <div class="asks">
        <ul class="legend">
          <li><span class="legend__ring" aria-hidden="true"></span><span data-t="ov.gaia"></span></li>
          <li><span class="legend__diamond" aria-hidden="true"></span><span data-t="ov.wise"></span></li>
        </ul>
        <p class="exhibit__k" data-t="ov.head"></p>
        <ol class="asks__list" id="asks"></ol>
      </div>
    </figure>
  </section>

  <!-- 18 · which other telescopes looked here -->
  <section class="slide slide--archives" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="arc.claim"></h2>
      <p class="slide__say" data-t="arc.say"></p>
      <p class="slide__src" data-t="arc.src"></p>
    </div>
    <figure class="exhibit">
      <p class="exhibit__k" data-t="arc.head"></p>
      <ol class="archives" id="archives"></ol>
    </figure>
  </section>

  <!-- 19 · a new release is one line -->
  <section class="slide slide--release" data-slide data-part="appendix">
    <div class="slide__text">
      <h2 class="slide__claim" data-t="rel.claim"></h2>
      <p class="slide__say" data-t="rel.say"></p>
      <p class="slide__src" data-t="rel.src"></p>
    </div>
    <figure class="exhibit">
      <p class="exhibit__k num">public/js/release.js</p>
      <pre class="code num"><span class="code__old">export const COLLECTIONS = ['spherex_qr2', 'spherex_qr2_deep'];</span>
<span class="code__new">export const COLLECTIONS = [<span class="code__typed" id="typed"></span><span class="code__caret" aria-hidden="true"></span>];</span></pre>
      <ol class="runbook">
        <li><span class="num" data-t="rel.when"></span><span data-t="rel.step1"></span></li>
        <li><span class="num">npm run bake</span><span data-t="rel.step2"></span></li>
        <li><span class="num">npm test</span><span data-t="rel.step3"></span></li>
      </ol>
    </figure>
  </section>

</main>

<footer class="foot">
  <button type="button" class="foot__key" id="prev" data-t-label="prev">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
  </button>
  <ol class="foot__scale" id="scale"></ol>
  <p class="foot__at num" id="at"></p>
  <button type="button" class="foot__key" id="next" data-t-label="next">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
  </button>
</footer>

<script type="module" src="js/talk.js"></script>
</body>
</html>
